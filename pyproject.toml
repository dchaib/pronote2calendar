[project]
name = "pronote2calendar"
version = "0.5.0"
description = "A simple tool to export your Pronote timetable to Google Calendar for easy access and integration with other apps."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pronotepy (==2.15.7)",
    "google-api-python-client (==2.200.0)",
    "pydantic-settings[yaml] (==2.15.0)",
    "email-validator (==2.3.0)",
    "jinja2 (==3.1.6)",
    "apprise (==1.13.1)",
]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[build-system]
requires = ["uv_build==0.12.9"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy (==2.3.1)",
    "pytest (==9.1.1)",
    "ruff (==0.16.6)",
]
