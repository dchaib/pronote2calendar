[project]
name = "pronote2calendar"
version = "1.1.0"
description = "A simple tool to export your Pronote timetable to Google Calendar for easy access and integration with other apps."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pronotepy (==2.15.7)",
    "google-api-python-client (==2.202.0)",
    "pydantic-settings[yaml] (==2.16.2)",
    "email-validator (==2.3.0)",
    "jinja2 (==3.1.6)",
    "apprise (==2.2.0)",
    "pydantic==2.14.3",
]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[build-system]
requires = ["uv_build==0.13.8"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy (==2.4.1)",
    "pytest (==9.2.0)",
    "ruff (==0.17.4)",
]
